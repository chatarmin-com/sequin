name: Publish cx-sequin

on:
  pull_request:
    paths:
      - 'Dockerfile'
      - 'LICENSE'
      - 'NOTICE'
      - 'docker/smoke-cx-sequin.sh'
      - '.github/workflows/publish-image.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Image tag and release version'
        required: true
        default: 'v0.14.6-1'
        type: string

permissions:
  contents: read

concurrency:
  group: cx-sequin-${{ github.event_name }}-${{ inputs.version || github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/chatarmin-com/cx-sequin
  VERSION: ${{ inputs.version || format('pr-{0}', github.event.number) }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate release version
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [[ "$GITHUB_REF" != 'refs/heads/main' ]]; then
            echo 'Publish releases from main.' >&2
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$ ]]; then
            echo 'Use a release tag such as v0.14.6-1.' >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build full self-hosted release
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}
          build-args: |
            SELF_HOSTED=1
            RELEASE_VERSION=${{ env.VERSION }}
          labels: |
            org.opencontainers.image.title=cx-sequin
            org.opencontainers.image.description=Chatarmin-maintained fork of Sequin
            org.opencontainers.image.source=https://github.com/chatarmin-com/sequin
            org.opencontainers.image.url=https://github.com/chatarmin-com/sequin
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify licenses and release startup
        env:
          IMAGE_REF: ${{ env.IMAGE }}:${{ env.VERSION }}
        run: bash docker/smoke-cx-sequin.sh

      - name: Save verified release image
        if: github.event_name == 'workflow_dispatch'
        run: docker save --output cx-sequin.tar "$IMAGE:$VERSION"

      - name: Upload verified release image
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: cx-sequin-image
          path: cx-sequin.tar
          compression-level: 0
          retention-days: 1

  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download verified release image
        uses: actions/download-artifact@v8
        with:
          name: cx-sequin-image

      - name: Load verified release image
        run: docker load --input cx-sequin.tar

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish verified image
        run: |
          docker push "$IMAGE:$VERSION"
          {
            echo "Published \`$IMAGE:$VERSION\`."
            echo
            echo 'Use the digest printed by docker push to pin the Railway deployment.'
          } >> "$GITHUB_STEP_SUMMARY"
